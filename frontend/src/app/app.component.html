<div class="app-container">
    <!-- Header -->
    <mat-toolbar color="primary" class="app-header">
        <mat-toolbar-row>
            <span class="app-title">
                <mat-icon class="app-icon">article</mat-icon>
                BriefNews
            </span>
            <span class="app-subtitle">AI-Powered News Summarization</span>
        </mat-toolbar-row>
    </mat-toolbar>

    <!-- Main Content -->
    <div class="main-content">
        <mat-card class="content-card">
            <mat-card-content>
                <mat-tab-group animationDuration="300ms" class="main-tabs">
                    <!-- News Articles Tab -->
                    <mat-tab label="News Articles">
                        <app-news-articles></app-news-articles>
                    </mat-tab>

                    <!-- URL Summarization Tab -->
                    <mat-tab label="Summarize URL">
                        <app-url-summarizer></app-url-summarizer>
                    </mat-tab>
                </mat-tab-group>
            </mat-card-content>
        </mat-card>
    </div>

    <!-- Footer -->
    <footer class="app-footer">
        <p>&copy; 2025 BriefNews. AI-powered news summarization.</p>
    </footer>
</div>
